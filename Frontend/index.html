
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Customer Support</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat {
      width: 100%;
      max-width: 600px;
      height: min(760px, 90vh);
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 35px #1720331a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #173c72;
      color: white;
      padding: 22px;
    }

    header h1 { margin: 0 0 7px; font-size: 23px; }
    header p { margin: 0; font-size: 14px; opacity: .85; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
      font-size: 15px;
    }

    .bot { align-self: flex-start; background: #edf2f7; }
    .user { align-self: flex-end; background: #dceafe; }
    .error { color: #a11; }

    form {
      display: flex;
      gap: 8px;
      border-top: 1px solid #e2e8f0;
      padding: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 9px;
      background: #173c72;
      color: white;
      padding: 0 18px;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled { opacity: .55; cursor: wait; }

    @media (max-width: 500px) {
      body { padding: 0; }
      .chat { height: 100vh; max-width: none; border-radius: 0; }
    }
  </style>
</head>

<body>
  <main class="chat">
    <header>
      <h1>Customer Support</h1>
      <p>AI-powered support assistant · Demo</p>
    </header>

    <section id="messages" aria-live="polite">
      <div class="message bot">
        Hello! How can I help you today? You can ask about delivery,
        orders, refunds, cancellations, or technical support.
      </div>
    </section>

    <form id="chat-form">
      <input
        id="question"
        type="text"
        placeholder="Type your question..."
        maxlength="2000"
        autocomplete="off"
        required
      />
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const messages = document.getElementById("messages");

    // Demo-only state. This is not authentication or durable storage.
    let awaitingOrderId = false;
    let pendingOrderMessage = "";

    function addMessage(text, type = "bot") {
      const element = document.createElement("div");
      element.className = `message ${type}`;
      element.textContent = text;
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
      return element;
    }

    function isGreeting(text) {
      return /^(hi|hello|hey|good morning|good afternoon|good evening)[!. ]*$/i
        .test(text.trim());
    }

    function isMissingOrderId(text) {
      return /\b(don't know|do not know|don't have|do not have|can't find|cannot find|forgot|no idea)\b/i
        .test(text);
    }

    function needsOrderWorkflow(text) {
      return /\b(order|cancel|cancellation|refund|shipment|tracking|track my|delivery status|duplicate charge|damaged item)\b/i
        .test(text);
    }

    function extractOrderId(text) {
      const match = text.match(/\bORD-[A-Z0-9-]+\b/i);
      return match ? match[0].toUpperCase() : null;
    }

    async function postJson(path, body) {
      const response = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        let detail = data.detail;

        if (Array.isArray(detail)) {
          detail = detail.map(item => item.msg).join(", ");
        }

        if (typeof detail !== "string") {
          detail = `Request failed (${response.status})`;
        }

        throw new Error(detail);
      }

      return data;
    }

    function getAnswer(data) {
      if (typeof data === "string") return data;
      if (data && typeof data.answer === "string") {
        let answer = data.answer;

        if (data.requires_human_review) {
          answer += "\n\nThis request requires human review.";
        }

        return answer;
      }

      return "I received a response but couldn't read its answer.";
    }

    async function sendToKnowledgeBase(question, pending) {
      const data = await postJson("/ask", { question });
      pending.textContent = getAnswer(data);
    }

    async function sendToAgent(message, pending, orderId = null) {
      // Demo identifier only. Replace with a trusted customer identity
      // before connecting real customer orders.
      const data = await postJson("/agent", {
        customer_id: "CUST-1001",
        message,
        order_id: orderId
      });

      pending.textContent = getAnswer(data);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message || sendButton.disabled) return;

      addMessage(message, "user");
      input.value = "";
      sendButton.disabled = true;

      const pending = addMessage("Thinking...", "bot");

      try {
        if (isGreeting(message)) {
          pending.textContent =
            "Hello! How can I help you today? You can ask about orders, " +
            "delivery, refunds, cancellations, or technical support.";
          return;
        }

        // Handle the customer's answer to an order-ID request.
        if (awaitingOrderId) {
          if (isMissingOrderId(message)) {
            pending.textContent =
              "You can usually find your order ID in your order " +
              "confirmation email or in your account's order history. " +
              "If you still cannot find it, please contact support. " +
              "I haven't looked up or changed any order.";
            return;
          }

          const orderId = extractOrderId(message);

          if (!orderId) {
            pending.textContent =
              "I couldn't recognize an order ID. For this demo, it " +
              "should look like ORD-1001. Please check your confirmation " +
              "email, or contact support if you cannot find it.";
            return;
          }

          // Reset the pending state before making the request so
          // a failed call doesn't trap the conversation.
          awaitingOrderId = false;

          await sendToAgent(
            pendingOrderMessage,
            pending,
            orderId
          );

          pendingOrderMessage = "";
          return;
        }

        if (needsOrderWorkflow(message)) {
          const orderId = extractOrderId(message);

          if (!orderId) {
            awaitingOrderId = true;
            pendingOrderMessage = message;

            pending.textContent =
              "I can help with your order request. Please provide " +
              "your order ID (for example, ORD-1001 in this demo). " +
              "If you cannot find it, tell me and I'll explain the " +
              "next step. No order changes will be made automatically.";
            return;
          }

          await sendToAgent(message, pending, orderId);
          return;
        }

        await sendToKnowledgeBase(message, pending);

      } catch (error) {
        pending.classList.add("error");
        pending.textContent =
          `Unable to complete your request: ${error.message}\n\n` +
          "Please try again. If the problem continues, contact support.";
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
